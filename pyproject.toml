[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orrery"
version = "0.1.0"
description = "Solar system positions you can check against NASA"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["astronomy", "ephemeris", "solar-system", "eclipse", "orbital-mechanics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
# Ground truth for the M0 gate. Never imported by src/orrery.
truth = [
    "skyfield>=1.46",
    # Verify the ephemeris download against the OS certificate store. Only
    # needed behind a TLS-inspecting proxy; harmless everywhere else.
    "truststore>=0.9; python_version >= '3.10'",
]
viz = [
    "polyscope>=2.2",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
]

[project.urls]
Source = "https://github.com/art3mes/Orrery"
Issues = "https://github.com/art3mes/Orrery/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test needs internet (JPL element table, DE ephemeris)",
]
